services:
  - type: web
    name: kms-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: false
      - key: MONGO_URI
        sync: false   # Set this on the Render dashboard
      - key: JWT_SECRET
        sync: false   # Set this on the Render dashboard
      - key: CLIENT_URL
        sync: false   # Set to your Vercel frontend URL
